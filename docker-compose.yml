services:
  db:
    image: postgres:16-alpine
    container_name: dash-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dash_db}
      POSTGRES_USER: ${POSTGRES_USER:-dash_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dash_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dash-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dash_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dash_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dash_password}
      SERVER_PORT: 8085
      STORAGE_BASE_DIR: /app/data/users
    ports:
      - "8085:8085"
    volumes:
      - backend_data:/app/data

volumes:
  postgres_data:
  backend_data:
