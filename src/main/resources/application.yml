spring:
  application:
    name: ${APP_NAME:dash-backend}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dash_db}
    username: ${SPRING_DATASOURCE_USERNAME:dash_user}
    password: ${SPRING_DATASOURCE_PASSWORD:dash_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
